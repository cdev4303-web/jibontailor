name: Build Jibon Tailor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Web Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Sync Web Assets to Android Project
        run: |
          mkdir -p jibon/android-studio-project/app/src/main/assets/web
          cp -r dist/* jibon/android-studio-project/app/src/main/assets/web/
          echo "Web build assets successfully synced to Android assets."

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle (v8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔨 Build Android APK with Gradle
        working-directory: jibon/android-studio-project
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: 📂 Prepare APK Files for Download
        run: |
          mkdir -p final-apks
          
          # Copy and rename debug APK
          if [ -f "jibon/android-studio-project/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "jibon/android-studio-project/app/build/outputs/apk/debug/app-debug.apk" "final-apks/Jibon-Tailor-v1.0-debug.apk"
          fi
          
          # Copy and rename release APK
          if [ -f "jibon/android-studio-project/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "jibon/android-studio-project/app/build/outputs/apk/release/app-release.apk" "final-apks/Jibon-Tailor-v1.0-release.apk"
          elif [ -f "jibon/android-studio-project/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "jibon/android-studio-project/app/build/outputs/apk/release/app-release-unsigned.apk" "final-apks/Jibon-Tailor-v1.0-release.apk"
          fi
          
          echo "Generated APKs in final-apks/:"
          ls -lh final-apks/

      - name: 🚀 Upload APK Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Jibon-Tailor-Android-APK
          path: final-apks/*.apk
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Release (If tagged or created)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: final-apks/*.apk
          name: Jibon Tailor Mobile App ${{ github.ref_name }}
          body: |
            ## 📱 Jibon Tailor Android Application APK
            Download and install the APK on your Android device:
            - **`Jibon-Tailor-v1.0-debug.apk`** (Recommended for direct phone install)
            - **`Jibon-Tailor-v1.0-release.apk`**
